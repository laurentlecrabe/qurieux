<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qurieux">
<meta name="theme-color" content="#EEF4FB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Qurieux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Mise en page : une seule « scène » plein écran, des écrans qui glissent ; gros boutons en relief, formes rondes, un pastel par chapitre */
:root{
  --bg:#EEF4FB; --paper:#FFFFFF; --ink:#1E2A47; --ink-soft:#5B6785; --line:#D6E0EE;
  --sun:#FFC536; --sun-deep:#E5A400; --tomato:#FF5D4E; --mint:#2EC99A; --sky:#3E9BFF; --lilac:#8C7CFF;
  --good:#22B07D; --good-bg:#E3F8EF; --oops:#FF8A3D; --oops-bg:#FFF0E3;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:26px; --press:6px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 28px;animation:enter .45s cubic-bezier(.2,.9,.3,1.2) both}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}

/* Boutons en relief */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:800;
  font-size:1.35rem;padding:14px 26px;border-radius:999px;background:var(--sky);color:#fff;
  box-shadow:0 var(--press) 0 #1F6FCC;transform:translateY(0);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(var(--press));box-shadow:0 0 0 #1F6FCC}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 var(--press) 0 var(--sun-deep)}
.btn.sun:active{box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 var(--press) 0 var(--line)}
.btn.ghost:active{box-shadow:none}
.btn.small{font-size:1.05rem;padding:10px 18px;--press:4px}

/* Barre du haut */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:8px 16px 8px 10px;
  font-family:var(--display);font-weight:800;font-size:1.35rem;box-shadow:0 4px 0 var(--line)}
.pill .star{width:30px;height:30px}
.icon-btn{width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 var(--line);font-size:1.5rem}
.icon-btn:active{transform:translateY(4px);box-shadow:none}
.top-right{display:flex;gap:10px;align-items:center}
.gear{position:relative}
.gear svg.ring{position:absolute;inset:-4px;width:60px;height:60px;transform:rotate(-90deg);pointer-events:none}
.gear svg.ring circle{fill:none;stroke:var(--sky);stroke-width:5;stroke-linecap:round;stroke-dasharray:170;stroke-dashoffset:170}
.gear.holding svg.ring circle{transition:stroke-dashoffset 2s linear;stroke-dashoffset:0}

/* Logo rébus */
.logo{display:flex;align-items:center;gap:4px}
.logo svg{height:72px;width:auto}
.rebus-hint{font-family:var(--display);font-weight:700;color:var(--ink-soft);font-size:.95rem;letter-spacing:.04em}

/* Héros */
.hero-card{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:20px;align-items:center;background:var(--paper);
  border-radius:34px;padding:18px 26px;box-shadow:0 8px 0 var(--line);position:relative;overflow:hidden}
.hero-card::before{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--bg)}
.hero-card>*{position:relative}
.hero-svg{width:100%;max-width:230px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hello{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.6vw,3.1rem);line-height:1;margin:0;text-wrap:balance}
.rank{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-weight:800;font-size:1.1rem;color:var(--ink-soft)}
.rank b{color:var(--ink);font-family:var(--display);font-size:1.35rem}
.meter{height:20px;background:var(--bg);border-radius:999px;overflow:hidden;margin:12px 0 6px;max-width:420px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FFDB70);border-radius:999px;transition:width .8s}
.meter-label{font-weight:700;color:var(--ink-soft);font-size:1rem}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}

/* Carte des missions */
.section-title{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:6px 0 -6px;display:flex;align-items:baseline;gap:10px}
.section-title small{font-family:var(--body);font-size:1rem;color:var(--ink-soft);font-weight:700}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.mission{position:relative;text-align:left;background:var(--paper);border-radius:var(--r);padding:16px 16px 14px;
  box-shadow:0 var(--press) 0 var(--c2);display:flex;flex-direction:column;gap:8px;min-height:190px;transition:transform .08s,box-shadow .08s}
.mission:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--c2)}
.mission .bubble{width:78px;height:78px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font-size:2.6rem}
.mission h3{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.05;margin:4px 0 0}
.mission .sub{font-weight:700;color:var(--ink-soft);font-size:.95rem}
.mission .stars{display:flex;gap:4px;margin-top:auto}
.mission .stars svg{width:28px;height:28px}
.mission .tag{position:absolute;top:14px;right:14px;font-family:var(--display);font-weight:800;font-size:.9rem;padding:4px 12px;border-radius:999px;background:var(--c1);color:var(--ink)}
.mission .tag.new{background:var(--tomato);color:#fff;animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-7deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}

/* Quiz */
.qtop{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:14px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line);transition:background .3s}
.steps i.ok{background:var(--good);box-shadow:none}
.steps i.ko{background:var(--oops);box-shadow:none}
.steps i.now{background:var(--c1);box-shadow:inset 0 0 0 3px var(--c2)}
.qcard{background:var(--paper);border-radius:34px;padding:26px 28px;box-shadow:0 8px 0 var(--c1);display:flex;flex-direction:column;gap:12px;position:relative}
.qlabel{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;color:var(--c3);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.12;margin:0;text-wrap:balance}
.qart{font-size:clamp(3rem,8vw,4.6rem);line-height:1;text-align:center;letter-spacing:.08em}
.speak{width:56px;height:56px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font-size:1.6rem;flex:none;box-shadow:0 4px 0 var(--c2)}
.speak:active{transform:translateY(4px);box-shadow:none}
.qhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{background:var(--paper);border-radius:24px;padding:20px 18px;min-height:128px;display:flex;align-items:center;gap:14px;
  font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,2.6vw,1.6rem);line-height:1.1;text-align:left;
  box-shadow:0 var(--press) 0 var(--line),inset 0 0 0 3px var(--line);transition:transform .08s,box-shadow .08s,background .2s}
.choice .em{font-size:2.3rem;line-height:1;flex:none}
.choice:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--line),inset 0 0 0 3px var(--line)}
.choice.big{flex-direction:column;justify-content:center;text-align:center;min-height:190px}
.choice.big .em{font-size:3.4rem}
.choice.right{background:var(--good-bg);box-shadow:0 var(--press) 0 var(--good),inset 0 0 0 4px var(--good);animation:pop .45s}
.choice.wrong{background:var(--oops-bg);box-shadow:0 var(--press) 0 var(--oops),inset 0 0 0 4px var(--oops);animation:shake .45s}
.choice.dim{opacity:.45}
@keyframes pop{40%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.numpad-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
.numdisplay{background:var(--paper);border-radius:24px;min-height:120px;display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:4rem;box-shadow:inset 0 0 0 4px var(--c1);font-variant-numeric:tabular-nums}
.numdisplay.empty{color:var(--line)}
.numdisplay.right{background:var(--good-bg);box-shadow:inset 0 0 0 4px var(--good);animation:pop .45s}
.numdisplay.wrong{background:var(--oops-bg);box-shadow:inset 0 0 0 4px var(--oops);animation:shake .45s}
.hint{font-weight:700;color:var(--ink-soft);font-size:1.05rem;text-align:center;margin-top:10px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:70px;border-radius:20px;background:var(--paper);font-family:var(--display);font-weight:800;font-size:2rem;box-shadow:0 5px 0 var(--line),inset 0 0 0 3px var(--line)}
.key:active{transform:translateY(5px);box-shadow:inset 0 0 0 3px var(--line)}
.key.ok{background:var(--good);color:#fff;box-shadow:0 5px 0 #168A60}
.key.ok:active{box-shadow:none}

/* Feuille de réponse */
.sheet-back{position:fixed;inset:0;background:rgba(30,42,71,.28);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(860px,100%);background:var(--paper);border-radius:34px 34px 0 0;padding:24px max(24px,env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .4s cubic-bezier(.2,.9,.3,1.15) both;border-top:10px solid var(--fb)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{font-family:var(--display);font-weight:800;font-size:2.1rem;margin:0;color:var(--fb);display:flex;align-items:center;gap:12px}
.sheet .answer{font-family:var(--display);font-weight:700;font-size:1.35rem}
.fact{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border-radius:22px;padding:16px 18px}
.fact .bulb{font-size:2rem;line-height:1}
.fact b{display:block;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.fact p{margin:2px 0 0;font-size:1.25rem;font-weight:700;line-height:1.35}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Résultat */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:10px}
.medal{width:190px;height:190px;animation:medal 1s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes medal{from{transform:scale(0) rotate(-40deg)}}
.result h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1;margin:0;text-wrap:balance}
.result .score{font-size:1.4rem;font-weight:800;color:var(--ink-soft)}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:70px;height:70px;opacity:0;animation:starin .5s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes starin{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
.unlocks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.unlock{background:var(--paper);border-radius:22px;padding:12px 18px;font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;gap:10px}
.unlock .em{font-size:1.8rem}
.result .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.reward-btn{font-size:1.6rem;padding:18px 32px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.04)}}

/* Vidéo */
.video-box{background:var(--ink);border-radius:30px;overflow:hidden;aspect-ratio:16/9;max-width:100%;width:100%;box-shadow:0 8px 0 var(--c2)}
.video-box iframe{width:100%;height:100%;border:0;display:block}
.video-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;color:#fff;text-decoration:none;
  font-family:var(--display);font-weight:800;font-size:1.6rem;text-align:center;padding:20px}
.video-link .play{width:110px;height:110px;border-radius:50%;background:var(--tomato);display:grid;place-items:center;box-shadow:0 8px 0 #C93A2D}
.video-title{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.1;margin:0}
.video-src{font-weight:700;color:var(--ink-soft)}

/* Vestiaire */
.locker{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:26px;align-items:start}
.panel{background:var(--paper);border-radius:30px;padding:20px 22px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.swatch{border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:.85rem;color:var(--ink-soft);
  box-shadow:inset 0 0 0 3px var(--line)}
.swatch i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.7rem}
.swatch.on{box-shadow:inset 0 0 0 4px var(--ink);color:var(--ink)}
.swatch.locked{opacity:.55}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.trophy{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.trophy svg{width:78px;height:78px}

/* Coin des parents */
.parent label{font-weight:800;display:block;margin-bottom:6px}
.parent input[type=text],.parent input[type=number]{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.parent .field{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.parent .field .em{font-size:1.8rem}
.toggle{display:flex;align-items:center;gap:12px;font-weight:800}
.toggle input{width:28px;height:28px}
.note{color:var(--ink-soft);font-weight:700;font-size:.95rem;line-height:1.4;margin:0}
.danger{background:var(--tomato);box-shadow:0 var(--press) 0 #C93A2D}
.danger:active{box-shadow:none}
.gate{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:460px;margin:40px auto 0}
.gate h1{font-family:var(--display);font-weight:800;font-size:2rem;margin:0}
.gate .q{font-family:var(--display);font-weight:800;font-size:2.6rem}

/* Confettis & étoile volante */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.fly-star{position:fixed;width:54px;height:54px;z-index:45;pointer-events:none;transition:transform .9s cubic-bezier(.5,-.3,.6,1),opacity .9s}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;
  padding:12px 22px;border-radius:999px;z-index:50;font-size:1.1rem;animation:fade .3s both}

@media (max-width:700px){
  .hero-card{grid-template-columns:1fr;text-align:center;justify-items:center}
  .meter{margin-inline:auto}
  .hero-actions{justify-content:center}
  .choices,.choices.three{grid-template-columns:1fr}
  .numpad-wrap{grid-template-columns:1fr}
  .locker{grid-template-columns:1fr}
  .qcard{padding:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="app"></div>
<canvas id="confetti"></canvas>

<script>
(() => {
"use strict";

/* ---------- Contenu pédagogique ---------- */

   {t:"qcm", q:"Comment s'appelle le savant qui étudie les fossiles de dinosaures ?", c:[["🦴","Paléontologue"],["🧑‍🚀","Astronaute"],["🥖","Boulanger"]], a:0,

   {t:"qcm", q:"Lequel était le plus long ?", c:[["🦕","Le diplodocus"],["🦖","Le T-Rex"]], a:0, big:true,
    f:"Le diplodocus mesurait environ 26 mètres : plus long que 2 bus mis bout à bout. Le T-Rex, lui, faisait 12 mètres."}
 ]},
 { id:"ocean", title:"Les océans", sub:"Plongée dans le grand bleu", em:"🐳", c1:"#CFE6FF", c2:"#3E9BFF", c3:"#1F6FCC",
   video:{ id:"7iyzKyVzajU", title:"Est-ce que les baleines sont menacées ?", src:"1 jour, 1 question" },
   qs:[

function ac(){ if(!S.sound) return null; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC; }catch(e){ return null; } }
function tone(freq, start, dur, type="sine", vol=.18){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  tap(){ tone(660,0,.08,"triangle",.08); },
  good(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.3,"triangle",.16)); },
  bad(){ tone(330,0,.22,"sine",.14); tone(262,.16,.32,"sine",.12); },
  fanfare(){ [523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.13,i===6?.7:.2,"square",.07)); }
};

/* ---------- Voix ---------- */
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}️]/gu,""));
    u.lang = "fr-FR"; u.rate = .92;
    const v = speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Confettis ---------- */
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function confetti(n=140){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio;
  const cols = ["#FFC536","#FF5D4E","#2EC99A","#3E9BFF","#8C7CFF","#FF6FB1"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*200, y:innerHeight*.45, vx:(Math.random()-.5)*16, vy:-Math.random()*16-6,
    s:6+Math.random()*8, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[i%cols.length], life:0, round:Math.random()<.3});
  if(!raf) loop();
}
function loop(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    if(p.round){ cx.beginPath(); cx.arc(0,0,p.s/2,0,7); cx.fill(); } else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore(); });
  parts = parts.filter(p=>p.y<innerHeight+40 && p.life<260);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}
function flyStar(fromEl){
  const target = document.querySelector("#runStars");
  if(!fromEl || !target) return;
  const a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
  const s = document.createElement("div"); s.className="fly-star"; s.innerHTML = STAR(true);
  s.style.left = (a.left+a.width/2-27)+"px"; s.style.top = (a.top+a.height/2-27)+"px";
  document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    s.style.transform = `translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.5) rotate(200deg)`;
    s.style.opacity = ".2";
  }));
  setTimeout(()=>{ s.remove(); target.classList.remove("bump"); void target.offsetWidth; }, 950);
}
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------- Quiz ---------- */
let R = null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function quiz(ci){
  const ch = CHAPTERS[ci];
  R = { ci, ch, i:0, good:0, res:[], qs: ch.qs.slice(0,Q_PER) };
  question();
}
function question(){
  const {ch, i, qs} = R, q = qs[i];
  const steps = qs.map((_,k)=>`<i class="${R.res[k]===true?"ok":R.res[k]===false?"ko":k===i?"now":""}"></i>`).join("");
  let body = "";
  if(q.t==="qcm"){
    const opts = shuffle(q.c.map((c,k)=>({em:c[0], txt:c[1], ok:k===q.a})));
    R.opts = opts;
    const cls = q.big ? "" : (opts.length===3 ? "three" : "");
    body = `<div class="choices ${cls}">${opts.map((o,k)=>`<button class="choice ${q.big?"big":""}" data-k="${k}"><span class="em">${o.em}</span><span>${esc(o.txt)}</span></button>`).join("")}</div>`;
  } else if(q.t==="vf"){
    R.opts = [{em:"👍",txt:"Vrai",ok:q.a===true},{em:"👎",txt:"Faux",ok:q.a===false}];
    body = `<div class="choices">${R.opts.map((o,k)=>`<button class="choice big" data-k="${k}"><span class="em">${o.em}</span><span>${o.txt}</span></button>`).join("")}</div>`;
  } else {
    R.typed = "";
    body = `<div class="numpad-wrap">
      <div><div class="numdisplay empty" id="nd">?</div>${q.h?`<p class="hint">Petit coup de pouce : ${esc(q.h)}</p>`:""}</div>
      <div class="numpad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-d="${d}">${d}</button>`).join("")}
        <button class="key" data-d="del" aria-label="Effacer">⌫</button><button class="key" data-d="0">0</button><button class="key ok" data-d="ok" aria-label="Valider">✓</button></div>
    </div>`;
  }
  const el = show(`<div class="wrap">
    <div class="qtop">
      <button class="icon-btn" id="quit" aria-label="Retour à la carte">✕</button>
      <div class="steps" aria-label="Question ${i+1} sur ${qs.length}">${steps}</div>
      <span class="pill" id="runStars">${STAR()} ${R.good}</span>
    </div>
    <div class="qcard">
      <div class="qhead">
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <span class="qlabel">${ch.em} ${esc(ch.title)} · question ${i+1}</span>
          <h1 class="qtext">${esc(q.q)}</h1>
        </div>
        <button class="speak" id="say" aria-label="Lire la question à voix haute">🔊</button>
      </div>
      ${q.art?`<div class="qart" aria-hidden="true">${q.art}</div>`:""}
    </div>
    ${body}
  </div>`, chVars(ch));
  el.querySelector("#quit").onclick=()=>{ sfx.tap(); home(); };
  const sayText = q.q + (q.t==="qcm"||q.t==="vf" ? " " + R.opts.map(o=>o.txt).join(" ? ") + " ?" : "");
  el.querySelector("#say").onclick=()=>speak(sayText);
  if(S.autoRead) setTimeout(()=>speak(sayText), 350);
  if(q.t==="num"){
    const nd = el.querySelector("#nd");
    el.querySelectorAll(".key").forEach(k=>k.onclick=()=>{
      if(R.locked) return;
      const d = k.dataset.d; sfx.tap();
      if(d==="del") R.typed = R.typed.slice(0,-1);
      else if(d==="ok"){ if(R.typed!=="") answer(+R.typed===q.a, nd, String(q.a)); return; }
      else if(R.typed.length<4) R.typed = (R.typed==="0"?"":R.typed) + d;
      nd.textContent = R.typed || "?"; nd.classList.toggle("empty", !R.typed);
    });
  } else {
    el.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      if(R.locked) return;
      const o = R.opts[+b.dataset.k];
      el.querySelectorAll(".choice").forEach((x,k)=>{
        if(R.opts[k].ok) x.classList.add("right");
        else if(x!==b) x.classList.add("dim");
      });
      if(!o.ok) b.classList.add("wrong");
      const right = R.opts.find(x=>x.ok);
      answer(o.ok, b, right.txt);
    });
  }
  R.locked = false;
}
function answer(ok, el, rightTxt){
  R.locked = true;
  const q = R.qs[R.i];
  R.res[R.i] = ok;
  if(ok){ R.good++; sfx.good(); confetti(70); flyStar(el); if(el.classList.contains("numdisplay")) el.classList.add("right"); }
  else { sfx.bad(); if(el.classList.contains("numdisplay")) el.classList.add("wrong"); }
  setTimeout(()=>{
    const rs = document.querySelector("#runStars"); if(rs) rs.innerHTML = `${STAR()} ${R.good}`;
    const last = R.i === R.qs.length-1;
    const pick = a => a[Math.floor(Math.random()*a.length)];
    const back = document.createElement("div"); back.className="sheet-back";
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" style="--fb:${ok?"var(--good)":"var(--oops)"}">
      <h2>${ok?"🎉 "+pick(PRAISE):"💪 "+pick(OOPS)}</h2>
      ${ok?"":`<div class="answer">La bonne réponse : ${esc(rightTxt)}</div>`}
      <div class="fact"><span class="bulb">💡</span><div><b>Le sais-tu ?</b><p>${esc(q.f)}</p></div></div>
      <div class="row">
        <button class="btn ghost small" id="sayFact">🔊 Écouter</button>
        <button class="btn ${ok?"":"sun"}" id="next">${last?"Voir mon score 🏆":"Question suivante →"}</button>
      </div></div>`;
    document.body.appendChild(back);
    back.querySelector("#sayFact").onclick=()=>speak((ok?"":"La bonne réponse : "+rightTxt+". ")+q.f);
    if(S.autoRead) speak((ok?"":"La bonne réponse : "+rightTxt+". ")+q.f);
    back.querySelector("#next").onclick=()=>{ sfx.tap(); back.remove(); if(last) result(); else { R.i++; question(); } };
    back.querySelector("#next").focus();
  }, ok ? 650 : 900);
}

/* ---------- Résultat ---------- */
function result(){
  const {ch, good} = R;
  const before = totalStars(), prevBest = S.best[ch.id]||0, prevRank = rankOf(before);
  if(good > prevBest) S.best[ch.id] = good;
  S.plays++;
  const after = totalStars(), newRank = rankOf(after);
  const unlocked = [];
  if(!prevBest && good>0) unlocked.push({em:ch.em, txt:`Nouvel emblème pour ta tenue`});
  CAPES.forEach(c=>{ if(c.need>before && c.need<=after) unlocked.push({em:"🦸", txt:`Cape ${c.name.toLowerCase()} débloquée`, color:c.c}); });
  if(newRank.name!==prevRank.name) unlocked.unshift({em:"🎖️", txt:`Nouveau grade : ${newRank.name}`});
  save();
  const m = medalOf(good), st = chapterStars(good);
  const title = good===Q_PER ? "Sans faute, champion !" : good>=7 ? "Mission brillante !" : good>=5 ? "Belle mission !" : good>=1 ? "Mission accomplie !" : "Tu t'es bien battu !";
  const vid = videoFor(ch);
  const el = show(`<div class="wrap result">
    ${medalSVG(m, ch.em)}
    <h1>${title}</h1>
    <div class="score">${good} bonne${good>1?"s":""} réponse${good>1?"s":""} sur ${Q_PER}${good>prevBest && prevBest ? " · nouveau record !" : ""}</div>
    <div class="bigstars">${[0,1,2].map(k=>`<span style="display:contents">${STAR(k<st).replace('class="star"',`class="star" style="animation-delay:${.5+k*.35}s"`)}</span>`).join("")}</div>
    ${unlocked.length?`<div class="unlocks">${unlocked.map(u=>`<div class="unlock">${u.color?`<span style="width:30px;height:30px;border-radius:50%;background:${u.color};border:3px solid var(--ink);flex:none"></span>`:`<span class="em">${u.em}</span>`}${esc(u.txt)}</div>`).join("")}</div>`:""}
    <div class="actions">
      ${vid ? `<button class="btn sun reward-btn" id="video">🎬 Ma vidéo récompense</button>` : ""}
    </div>
    <div class="actions">
      <button class="btn ghost small" id="again">↻ Rejouer</button>
      <button class="btn ghost small" id="map">🗺️ La carte</button>
    </div>
  </div>`, chVars(ch));
  setTimeout(()=>{ sfx.fanfare(); confetti(good>=5?220:120); }, 300);
  if(vid) el.querySelector("#video").onclick=()=>{ sfx.tap(); video(ch); };
  el.querySelector("#again").onclick=()=>{ sfx.tap(); quiz(R.ci); };
  el.querySelector("#map").onclick=()=>{ sfx.tap(); home(); };
}

/* ---------- Coin des parents ---------- */
function parentGate(btn){
  let t = null;
  const start = e => { e.preventDefault(); btn.classList.add("holding"); t = setTimeout(()=>{ btn.classList.remove("holding"); gate(); }, 2000); };
  const stop = () => { btn.classList.remove("holding"); clearTimeout(t); };
  btn.addEventListener("pointerdown", start); ["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev, stop));
  btn.addEventListener("click", ()=>{ if(!btn.classList.contains("holding")) toast("Coin des parents : garde le doigt appuyé 2 secondes"); });
}
function gate(){
  const a = 12+Math.floor(Math.random()*8), b = 6+Math.floor(Math.random()*4);
  const el = show(`<div class="gate">
    <h1>Coin des parents</h1>
    <p class="note">Pour entrer, réponds à ce calcul :</p>
    <div class="q">${a} × ${b} = ?</div>
    <input type="number" inputmode="numeric" id="gateIn" style="font:inherit;font-size:2rem;text-align:center;width:180px;padding:10px;border-radius:16px;border:3px solid var(--line)">
    <div style="display:flex;gap:12px"><button class="btn ghost small" id="cancel">Annuler</button><button class="btn small" id="ok">Entrer</button></div>
  </div>`);
  const inp = el.querySelector("#gateIn"); inp.focus();
  const go = () => { if(+inp.value === a*b) parents(); else { sfx.bad(); toast("Ce n'est pas le bon résultat"); inp.value=""; } };
  el.querySelector("#ok").onclick = go; inp.onkeydown = e => { if(e.key==="Enter") go(); };
  el.querySelector("#cancel").onclick = home;
}
function parents(confirmReset=false){
  const el = show(`<div class="wrap parent">
    <div class="qtop" style="grid-template-columns:52px 1fr">
      <button class="icon-btn" id="back" aria-label="Retour">←</button>
      <h1 class="section-title" style="margin:0">Coin des parents</h1>
    </div>
    <div class="panel">
      <h2>Réglages</h2>
      <label class="toggle"><input type="checkbox" id="autoRead" ${S.autoRead?"checked":""}> Lire chaque question à voix haute automatiquement</label>
      <label class="toggle"><input type="checkbox" id="sound" ${S.sound?"checked":""}> Sons et musiques</label>
    </div>
    <div class="panel">
      <h2>Vidéos de récompense</h2>
      <p class="note">Colle un lien YouTube pour remplacer la vidéo d'un chapitre. Laisse vide pour garder celle proposée.</p>
      ${CHAPTERS.map(c=>`<div class="field"><span class="em">${c.em}</span><div><label for="v-${c.id}">${esc(c.title)} <span class="note" style="display:inline">· par défaut : ${esc(c.video.title)} (${esc(c.video.src)})</span></label>
        <input type="text" id="v-${c.id}" data-v="${c.id}" placeholder="https://www.youtube.com/watch?v=…" value="${esc(S.videos[c.id]||"")}"></div></div>`).join("")}
      <div><button class="btn small" id="saveV">Enregistrer les vidéos</button></div>
    </div>
    <div class="panel">
      <h2>Progression de Marcel</h2>
      <p class="note">${totalStars()} étoiles sur ${CHAPTERS.length*Q_PER} · ${S.plays} mission${S.plays>1?"s":""} jouée${S.plays>1?"s":""}. La progression est enregistrée sur cet iPad.</p>
      <div>${confirmReset
        ? `<p class="note" style="color:var(--tomato)">Tout effacer ? Les étoiles, médailles et capes repartent à zéro.</p><div style="display:flex;gap:10px;margin-top:10px"><button class="btn ghost small" id="noReset">Garder</button><button class="btn small danger" id="yesReset">Oui, tout effacer</button></div>`
        : `<button class="btn ghost small" id="reset">Remettre à zéro</button>`}</div>
    </div>
  </div>`);
  el.querySelector("#back").onclick = home;
  el.querySelector("#autoRead").onchange = e => { S.autoRead = e.target.checked; save(); };
  el.querySelector("#sound").onchange = e => { S.sound = e.target.checked; save(); };
  el.querySelector("#saveV").onclick = () => {
    let bad = [];
    el.querySelectorAll("[data-v]").forEach(i=>{ const v=i.value.trim(); if(v && !ytId(v)) bad.push(i.dataset.v); else S.videos[i.dataset.v]=v; });
    save(); toast(bad.length ? "Un lien n'est pas un lien YouTube valide" : "Vidéos enregistrées");
  };
  const r = el.querySelector("#reset"); if(r) r.onclick = () => parents(true);
  const n = el.querySelector("#noReset"); if(n) n.onclick = () => parents(false);
  const y = el.querySelector("#yesReset"); if(y) y.onclick = () => { S = Object.assign({}, DEF, {videos:S.videos, autoRead:S.autoRead, sound:S.sound}); save(); toast("Progression remise à zéro"); home(); };
}

/* ---------- Démarrage ---------- */
try{ if("speechSynthesis" in window) speechSynthesis.getVoices(); }catch(e){}
if(!framed && "serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
document.addEventListener("gesturestart", e=>e.preventDefault());
home();
})();
</script>

</body>
</html>
